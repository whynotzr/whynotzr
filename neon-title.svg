<svg width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-wide" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" />
    </filter>
    <filter id="glow-tight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <linearGradient id="violet-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="50%" stop-color="#d8b4fe" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  
  <text x="50%" y="62" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="10" fill="#7e22ce" stroke="#9333ea" stroke-width="8" filter="url(#glow-wide)">
    ⚡ WHYNOTZR ⚡
  </text>

  
  <text x="50%" y="62" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="10" fill="#a855f7" stroke="#c084fc" stroke-width="3" filter="url(#glow-tight)">
    ⚡ WHYNOTZR ⚡
  </text>

  
  <text x="50%" y="62" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Roboto, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="10" fill="#e9d5ff" stroke="#a855f7" stroke-width="1.8">
    <animate attributeName="stroke" values="#9333ea;#e879f9;#9333ea" dur="2.5s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#d8b4fe;#f5d0fe;#d8b4fe" dur="2.5s" repeatCount="indefinite" />
    ⚡ WHYNOTZR ⚡
  </text>

  
  <line x1="260" y1="88" x2="540" y2="88" stroke="#9333ea" stroke-width="6" filter="url(#glow-tight)" />
  <line x1="260" y1="88" x2="540" y2="88" stroke="url(#violet-line)" stroke-width="2.5" stroke-linecap="round" />
</svg>
