<svg width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#d8b4fe" flood-opacity="1" />
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#a855f7" flood-opacity="0.95">
        <animate attributeName="stdDeviation" values="6;10;6" dur="2.6s" repeatCount="indefinite" />
      </feDropShadow>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#6b21a8" flood-opacity="0.9">
        <animate attributeName="stdDeviation" values="14;22;14" dur="2.6s" repeatCount="indefinite" />
      </feDropShadow>
    </filter>

    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>

    <style>
      .neon-text {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 10px;
        fill: #f3e8ff;
        stroke: url(#violet-grad);
        stroke-width: 2.2px;
        filter: url(#neon-glow);
      }
      .bolt {
        fill: #e9d5ff;
        stroke: #a855f7;
        stroke-width: 1.8px;
      }
      .scanline {
        stroke: url(#violet-grad);
        stroke-width: 3;
        stroke-linecap: round;
        filter: url(#neon-glow);
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: line-draw 2s ease-out forwards;
      }
      @keyframes line-draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <text x="50%" y="62" text-anchor="middle" class="neon-text">
    <tspan class="bolt">⚡</tspan> WHYNOTZR <tspan class="bolt">⚡</tspan>
  </text>

  <line x1="270" y1="88" x2="530" y2="88" class="scanline" />
</svg>
