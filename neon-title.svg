<svg width="800" height="110" viewBox="0 0 800 110" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feGaussianBlur stdDeviation="16" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    
    <linearGradient id="violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    
    <linearGradient id="neon-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <style>
      .neon-text {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 900;
        letter-spacing: 10px;
        fill: #ffffff;
        stroke: url(#violet-grad);
        stroke-width: 1.8px;
        filter: url(#neon-glow);
        animation: flicker 4s infinite alternate;
      }
      .bolt {
        fill: #e9d5ff;
        stroke: url(#neon-accent);
        stroke-width: 1.5px;
        filter: url(#neon-glow);
        animation: pulse 1.8s ease-in-out infinite alternate;
      }
      .scanline {
        stroke: url(#violet-grad);
        stroke-width: 2.5;
        stroke-linecap: round;
        filter: url(#neon-glow);
        stroke-dasharray: 260;
        stroke-dashoffset: 260;
        animation: line-draw 2.5s ease-out forwards;
      }
      @keyframes flicker {
        0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% {
          opacity: 1;
        }
        20%, 24%, 55% {
          opacity: 0.72;
          filter: drop-shadow(0 0 4px #7c3aed);
        }
      }
      @keyframes pulse {
        from { opacity: 0.75; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1.03); }
      }
      @keyframes line-draw {
        to { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  
  <text x="50%" y="62" text-anchor="middle" class="neon-text">
    <tspan class="bolt">⚡</tspan> WHYNOTZR <tspan class="bolt">⚡</tspan>
  </text>

  
  <line x1="270" y1="88" x2="530" y2="88" class="scanline" />
</svg>
